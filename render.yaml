services:
  # ----------------------------------------------------------------
  # 백엔드 (Express API)
  # ----------------------------------------------------------------
  - type: web
    name: hh-budget-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ----------------------------------------------------------------
  # 프론트엔드 (Next.js) — 정적 export → Render Static Site
  # (콜드스타트 없이 CDN으로 바로 서빙돼요. 이 블록은 참고용이고,
  # 실제로는 Render 대시보드에서 이 설정 그대로 "새 Static Site"를 만들어야 해요 —
  # 자세한 건 같이 드린 배포 가이드를 참고해주세요.)
  # ----------------------------------------------------------------
  - type: web
    runtime: static
    name: hh-budget-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
